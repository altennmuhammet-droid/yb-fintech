<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <title>YB Fintech</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect
      var segmentCount = 1;
      var location = window.location;
      var path = location.pathname.slice(1).split('/').slice(segmentCount).join('/');
      location.replace(
        location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') +
        '/yb-fintech/#' + (path ? '/' + path : '/') +
        (location.search ? location.search : '')
      );
    </script>
  </head>
  <body>
  </body>
</html>
